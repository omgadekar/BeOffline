<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"><style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Instrument Sans", system-ui, sans-serif; color: #1C1915; }
.mono { font-family: "JetBrains Mono", monospace; letter-spacing: 1.6px; font-size: 11px; color: #6B635A; }
.screen { width: 390px; height: 844px; background: #F7F3ED; display: flex; flex-direction: column;
          overflow: hidden; position: relative; }
.pad { padding: 0 22px; }
.row { display: flex; align-items: center; gap: 13px; border-radius: 15px; padding: 14px 15px; }
.icon { width: 38px; height: 38px; border-radius: 11px; background: #EFE9E0; flex-shrink: 0; }
.name { font-size: 15.5px; font-weight: 500; }
.sub { font-size: 13px; margin-top: 3px; }
.grow { flex: 1; min-width: 0; }
.btn { background: #A8452A; color: #fff; font-weight: 600; font-size: 15.5px; border-radius: 15px;
       padding: 15px; text-align: center; }
.nav { border-top: 1px solid #E6DED2; background: #FFFFFF; display: flex; padding: 12px 0 26px; }
.nav div { flex: 1; text-align: center; font-size: 11.5px; font-weight: 500; color: #6B635A; }
.nav .on { color: #A8452A; }
.h1 { font-size: 27px; line-height: 34px; font-weight: 500; letter-spacing: -0.6px; }
.lede { font-size: 14.5px; line-height: 21px; color: #6B635A; margin-top: 8px; }
