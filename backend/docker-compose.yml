# Local dev database for the accountability API.
#   docker compose up -d
#   dotnet run --project src/BeOffline.Api
# (appsettings.Development.json points at this instance; production runs on
# the OCI VM's existing Postgres.)
services:
  postgres:
    image: postgres:16
    container_name: beoffline-postgres
    environment:
      POSTGRES_DB: beoffline
      POSTGRES_USER: beoffline
      POSTGRES_PASSWORD: beoffline_dev
    ports:
      - "5432:5432"
    volumes:
      - beoffline-pgdata:/var/lib/postgresql/data

volumes:
  beoffline-pgdata:
