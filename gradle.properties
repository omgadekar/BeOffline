org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=true

# Point Gradle to Android Studio's bundled JDK (JBR) to avoid JDK version conflicts
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Workaround for AGP 8.1.x jlink/JdkImageTransform bug with JDK 21
# See: https://issuetracker.google.com/issues/294137077
android.experimental.testOptions.managedDevices.maxConcurrentDevices=0

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
